[project]
name = "cellml2fruitcropxl"
version = "0.1.0"
description = "CellML-to-Java tooling service for FruitCropXL: generates readable, debuggable Java ODE models from CellML files"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
dependencies = [
    "libcellml",
]

[project.optional-dependencies]
test = ["scipy", "numpy", "pandas"]

[project.scripts]
cellml2fruitcropxl = "cellml2fruitcropxl.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends._meta:setuptools_build_meta"

[tool.setuptools.packages.find]
where = ["src"]
